name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Writing the built site to the gh-pages branch needs contents: write.
permissions:
  contents: write

# A newer push supersedes an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks first, then builds — a type error fails the deploy
      # instead of shipping a broken bundle to the phone.
      - run: npm run build

      - run: npm run selftest

      # Publishing to a branch rather than via actions/deploy-pages, because
      # Pages serves only one deployment per repo: the preview build needs to
      # live alongside this one, in /preview on the same branch.
      # Requires Settings -> Pages -> Source = "Deploy from a branch",
      # branch gh-pages, folder / (root).
      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # The preview build lives in /preview on this same branch — publishing
          # the live site must not sweep it away.
          keep_files: true
