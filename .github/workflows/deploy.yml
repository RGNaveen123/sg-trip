name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing here can write to the repo contents.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks first, then builds — a type error fails the deploy
      # instead of shipping a broken bundle to the phone.
      - run: npm run build

      - run: npm run selftest

      # No `enablement: true` here. It only works when Pages has never been set
      # up; once Pages exists in "deploy from a branch" mode this step fails and
      # takes the whole deploy with it. Set Settings -> Pages -> Source to
      # "GitHub Actions" once, by hand, and this just reads that config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
